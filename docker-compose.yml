services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    environment:
      MODEL: ${MODEL:-ZhengPeng7/BiRefNet}
      MODEL_REVISION: ${MODEL_REVISION:-e2bf8e4460fc8fa32bba5ea4d94b3233d367b0e4}
      DEVICE: ${DEVICE:-auto}
      INFERENCE_RESOLUTION: ${INFERENCE_RESOLUTION:-1024}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-15728640}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-40000000}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_CONCURRENT_INFERENCES: ${MAX_CONCURRENT_INFERENCES:-1}
      INFERENCE_QUEUE_TIMEOUT_SECONDS: ${INFERENCE_QUEUE_TIMEOUT_SECONDS:-30}
    volumes:
      - model-cache:/models/huggingface
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  model-cache:
